name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            build-args: --mac --arm64
            artifacts: release/*.dmg
          - name: Windows x64
            os: windows-latest
            build-args: --win --x64
            artifacts: release/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本号唯一真源是 package.json，tag 必须与其一致，防止产出的包和标签不符。
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_tag="v$(node -p "require('./package.json').version")"
          if [ "$package_tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $package_tag"
            exit 1
          fi

      - name: Build
        run: pnpm build

      # 未配置签名证书：macOS 走 ad-hoc 签名（package.json mac.identity="-" 且关闭 hardenedRuntime），
      # 否则 arm64 产物未签名会被 Gatekeeper 直接判定为“已损坏”；Windows 仍为未签名。
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.build-args }} --publish never

      # 直接发布（非 draft）：更新检查读取 /releases/latest，draft 对用户不可见。
      # 带预发布后缀的 tag 自动标记 prerelease，/releases/latest 不会返回它。
      # --notes 会被前置到 --generate-notes 生成的更新日志之前，用于说明 macOS 首次打开步骤。
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_NOTES: |
            ## macOS 首次打开 / macOS first launch

            macOS 包为 ad-hoc 签名、未做 Apple 公证，首次打开会被 Gatekeeper 拦截。任选一种方式放行一次：
            访达中右键 App → 打开 → 再点“打开”；或 系统设置 → 隐私与安全性 → 仍要打开。

            The macOS build is ad-hoc signed and not notarized, so Gatekeeper blocks the first launch.
            Right-click the app → Open → Open, or use System Settings → Privacy & Security → Open Anyway.
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "LX Agent $tag" --notes "$INSTALL_NOTES" --generate-notes $prerelease || true
          fi
          gh release upload "$tag" ${{ matrix.artifacts }} --clobber
